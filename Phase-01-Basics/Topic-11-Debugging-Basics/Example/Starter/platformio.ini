; Topic 11 Starter: Debugging basics
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
; Turns crash backtraces (addresses) into function names and line numbers.
monitor_filters = esp32_exception_decoder, time
build_type = debug
